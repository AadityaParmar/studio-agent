# Replay script for petrostar-crm. Read by neome-studio/evals/run.mjs; shape in lib/replay.schema.json.
# Mapping only (golden.json score): ingest, review-draft, then resolve-module per Module (that is where mapping is set).
enterprise: falcon-ridge
engagement: quote-to-cash-crm
consultants:
  a: { name: Asha Rao, email: asha.rao@example.com }
  b: { name: Ben Okafor, email: ben.okafor@example.com }

steps:
  - id: ingest-first
    as: a
    skill: ingest
    args: "Enterprise folder falcon-ridge, Engagement quote-to-cash-crm"
    brief: >-
      First run for this Enterprise. The RFP waits in {ent}/inputs/. Names and titles from the key's
      Consultant choices. Say yes to what the skill proposes when the key agrees with it.

  - id: review-draft
    as: a
    skill: review-draft
    args: "falcon-ridge quote-to-cash-crm"
    brief: >-
      Fresh session. Confirm the Module set per the key's Consultant choices. Answer from the key; Don't know
      for the rest.

  - id: resolve-modules
    as: a
    skill: resolve-module
    args: "falcon-ridge quote-to-cash-crm"
    repeat: { max: 10, whileStatus: "^next \\|" }
    brief: >-
      Live mode, one Module per session: the one the skill picks. The Enterprise answers through you from the
      key; Don't know for anything else. Accept the skill's recommended Neome App and Delivery.

  - id: resolve-modules-more
    as: a
    skill: resolve-module
    args: "falcon-ridge quote-to-cash-crm"
    repeat: { max: 10, whileStatus: "^next \\|" }
    brief: >-
      Same as before: live mode, the Module the skill picks, Enterprise answers from the key only.
