let NOTIFS = [{to:"L1", t:"04:20 PM", m:"<b>Approval needed!</b> Q-2026-118 · 14% waits for you"}, {to:"SE", t:"09:30 AM", m:"<b>Rejected</b> Q-2026-120 by Head of Sales"}];
const value = q => q.qty*q.price*(1-q.disc/100);
const gm = q => value(q)-q.cost;
const nextLevel = q => levelsFor(q.disc).find(l => !q.approvals.some(a => a.lvl===l && a.d==="approved"));
const st = s => `<span class="s-${s}">${SPEC.statusLabel[s]}</span>`;
const reqTag = ids => ids.map(i=>`<span class="chip req reqtag" title="${SPEC.requirements.find(r=>r.id===i)?.title||''}">${i}</span>`).join(" ");
const oiTag = o => o ? `<span class="chip oi" title="${o.split(", ").map(x=>x+": "+SPEC.ois[x]).join(" | ")}">${o}</span>` : "";
const propTag = p => p ? `<span class="chip prop">proposed</span>` : "";

/* ---------- shared Neome pieces ---------- */
const launcher = (activeTile, roleId, notifs, phone) => `
  <div class="bar"><div class="avatar">👤</div><div class="t">${SPEC.appShort}</div><span class="ico" style="margin-left:auto">🔔</span></div>
  <div class="searchpill">🔍 Search messages or data</div>
  <div class="tiles">${SPEC.tiles.filter(t=>!t.admin||roleId==="AD").map(t=>`<div class="tile ${t.k} ${t.off?"off":""} ${activeTile===t.n?"on":""}" ${t.me&&!phone?`onclick="A.entity='${t.n}';A.open=null;render()"`:""}><div class="g">${t.g}</div>${t.n}</div>`).join("")}</div>

function ladder(q){
  const need = levelsFor(q.disc);
  if(!need.length) return `<div class="helper">Discount ${q.disc}% is under 10%, so no approval is needed. ${reqTag(["QUO-06"])}</div>`;
  return `<div class="lad">${["L1","L2","L3"].map(l=>{
    const a = q.approvals.find(x=>x.lvl===l), req = need.includes(l);
    const cls = !req?"skip": a?.d==="approved"?"done": a?.d==="rejected"?"rej": (q.status==="InApproval"&&nextLevel(q)===l)?"now":"";
    return `<div class="${cls}"><span>${l} · ${role(l).name} ${propTag(role(l).proposed)}</span><span class="small">${!req?"not needed":a?`${a.d} · ${a.at}`:(cls==="now"?"waiting":"—")}</span></div>`;
  }).join("")}</div>`;
}

function fieldHTML(q, f, editable){
  let v;
  if(f.id==="gm") v = `${fmt(gm(q))} <span class="small">(${Math.round(gm(q)/value(q)*100)}%)</span>`;
  else if(f.id==="docs") v = q.docs.length ? q.docs.map(d=>`<div>📄 <a href="#" onclick="return false">${d.name}</a> <span class="small">v${d.v} · ${d.by} · ${d.at}</span></div>`).join("") : `<span class="small">Nothing here</span>`;
  else if(f.type==="money") v = fmt(q[f.id]);
  else if(f.type==="link") v = `<a href="#" onclick="return false">${q[f.id]}</a>`;
  else if(f.id==="disc") v = q.disc+"%";
  else v = q[f.id] || "";
  if(editable && ["qty","price","disc","po","validity"].includes(f.id)) v = `<input value="${q[f.id]}" onchange="DATA.find(x=>x.no==='${q.no}')['${f.id}']=${["qty","price","disc"].includes(f.id)?"+this.value":"this.value"};render()">`;
  const trail = f.type==="date"?`<span class="tr">📅</span>`: f.type==="link"?`<span class="tr">＋ ✕</span>`: f.type==="person"?`<span class="tr">✕</span>`: f.type==="file"?`<span class="tr">📎</span>`:"";
  return `<div class="ofld ${f.sys||!editable?"ro":""}"><label>${f.label}${f.req?" *":""}</label><div class="val">${v}</div>${editable?trail:""}</div>
    ${f.id==="no"?`<div class="helper">System-generated ID</div>`:""}
    ${(f.oi||f.proposed)?`<div class="tags">${oiTag(f.oi)} ${propTag(f.proposed)}</div>`:""}<div class="tags">${reqTag(f.reqs)}</div>`;
}

function drawer(q, roleId, opts={}){
  const editable = q.status==="Draft" && roleId==="SE";
  const secs = [...new Set(SPEC.fields.map(f=>f.sec))];
  const nl = nextLevel(q), acts = [];
  if(roleId==="SE" && q.status==="Draft") acts.push(`<button class="tbtn" onclick="act('${q.no}','submit')">➤ Submit</button>`);
  if(roleId==="SE" && q.status==="Rejected") acts.push(`<button class="tbtn" onclick="act('${q.no}','revise')">📎 Upload new revision</button>`);
  if(roleId==="SE" && q.status==="Approved") acts.push(`<button class="tbtn" onclick="act('${q.no}','send')">➤ Mark sent</button>`);
  if(q.status==="InApproval"){ const can = roleId===nl;
    acts.push(`<button class="tbtn red" ${can?"":"disabled"} onclick="act('${q.no}','reject')">✕ Reject</button><button class="tbtn" ${can?"":"disabled"} onclick="act('${q.no}','approve')">✓ Approve ${nl}</button>`); }
  const note = q.status==="InApproval" && roleId!==nl ? `Waiting on ${nl} · ${role(nl).name}` : (!acts.length?"No action for this role":"");
  const tab = opts.tab || A.dtab;
  const details = `
    <div class="secdiv">Approval</div>${ladder(q)}<div class="tags">${reqTag(["QUO-06"])} ${oiTag("OI-08, OI-09")}</div>
    <div class="ofld ro"><label>Status</label><div class="val">${st(q.status)}</div></div>
    ${secs.map(s=>`<div class="secdiv">${s}</div>${SPEC.fields.filter(f=>f.sec===s).map(f=>fieldHTML(q,f,editable)).join("")}`).join("")}`;
  const activity = `<div class="timeline">${q.log.map(([w,who,what])=>`<div><div class="when">${w} · ${who}</div>${what}</div>`).join("")||'<div class="small">Nothing here</div>'}</div>`;
  return `<div class="drawer">
    <div class="bar"><span class="ico" style="cursor:pointer" onclick="${opts.static?"":"A.open=null;render()"}">›</span><div class="t">Quotation</div><span class="ico" style="margin-left:auto">🗑</span></div>
    <div class="dtabs"><button class="${tab==="d"?"on":""}" onclick="A.dtab='d';render()">DETAILS</button><button class="${tab==="a"?"on":""}" onclick="A.dtab='a';render()">ACTIVITY</button></div>
    <div class="dbody">${tab==="d"?details:activity}</div>
    <div class="dfoot"><span class="note">${note}</span><span class="ico">💬</span>${acts.join("")}</div></div>`;
}

function act(no, kind){
  const q = DATA.find(x=>x.no===no), who = role(A.role).person, t = "now";
  if(kind==="submit"){ const need=levelsFor(q.disc); q.status = need.length?"InApproval":"Approved"; q.log.push([t,who,`submitted · ${q.disc}% → ${need.length?need.join(" + "):"no approval needed"}`]); if(need.length) NOTIFS.unshift({to:need[0],t:"now",m:`<b>Approval needed!</b> ${q.no} · ${q.disc}% waits for you`}); else q.log.push([t,"system","Approved"]); }
  if(kind==="approve"){ const l=nextLevel(q); q.approvals.push({lvl:l,d:"approved",by:who,at:t}); q.log.push([t,who,`${l} approved`]); const n=nextLevel(q); if(!n){q.status="Approved"; q.log.push([t,"system","Approved (all required levels)"]); NOTIFS.unshift({to:"SE",t:"now",m:`<b>Approved</b> ${q.no}`});} else NOTIFS.unshift({to:n,t:"now",m:`<b>Approval needed!</b> ${q.no} · ${q.disc}% waits for you`}); }
  if(kind==="reject"){ const l=nextLevel(q); q.approvals.push({lvl:l,d:"rejected",by:who,at:t}); q.status="Rejected"; q.log.push([t,who,`${l} rejected`]); NOTIFS.unshift({to:"SE",t:"now",m:`<b>Rejected</b> ${q.no} by ${role(l).name}`}); }
  if(kind==="revise"){ const v=q.docs.length+1; q.docs.push({v,name:`${q.no.slice(-5)}_v${v}.pdf`,by:who,at:t}); q.approvals=[]; q.status="Draft"; q.log.push([t,who,`uploaded v${v} · back to Draft`]); }
  if(kind==="send"){ q.status="Sent"; q.log.push([t,who,"sent to customer"]); }
  render();
}

function stepRecord(s){
  const base = JSON.parse(JSON.stringify(seed().find(x=>x.no===s.q.no)));
  base.status = s.q.status; if(s.q.disc!=null) base.disc = s.q.disc; if(s.q.po) base.po = s.q.po;

  return base;
}

    <div class="C-trace"><h5 style="margin:0 0 6px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)">Requirement trace</h5><div class="small" style="margin-bottom:12px">Click a Requirement to see where it shows.</div>
      ${SPEC.requirements.map(r=>`<div class="r ${C.req===r.id?"on":""}" onclick="C.req=C.req==='${r.id}'?null:'${r.id}';render()"><span class="chip req">${r.id}</span> <b>${r.title}</b> ${oiTag(r.oi)}<div class="small" style="margin-top:3px">${r.acc.join(" · ")}</div></div>`).join("")}</div></div>`;
}

/* ======== tabs ======== */
const TABS = {app:["App",viewA], scen:["Scenarios",viewB], mob:["Mobile + trace",viewC]};
let TAB = "app";
function render(){
  const banner = `<div class="banner"><b>PROTOTYPE</b> · ${SPEC.enterprise} · Module <span class="chip">${SPEC.prefix}</span> ${SPEC.module} · ${SPEC.requirements.length} Requirements · ${Object.keys(SPEC.ois).length} Open Items · sample data <span style="margin-left:auto" class="chip">${SPEC.app} · ${SPEC.delivery}</span></div>`;
  const tabs = `<div class="ptabs">${Object.entries(TABS).map(([k,[n]])=>`<button class="${TAB===k?"on":""}" onclick="TAB='${k}';render()">${n}</button>`).join("")}
    <div class="right"><label class="small"><input type="checkbox" ${document.body.classList.contains("showtags")?"checked":""} onchange="document.body.classList.toggle('showtags',this.checked)"> show Requirement tags</label><button class="tbtn" onclick="DATA=seed();NOTIFS=[];A.open=null;render()">Reset</button></div></div>`;
  document.getElementById("app").innerHTML = banner + tabs + TABS[TAB][1]();
}
render();
</script>
