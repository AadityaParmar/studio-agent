name: checks

on:
  push:
    paths:
      - "neome-studio/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/checks.yml"
  pull_request:
    paths:
      - "neome-studio/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/checks.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
